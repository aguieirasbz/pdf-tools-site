<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Assine documentos PDF online adicionando uma imagem da sua assinatura em páginas específicas. Ferramenta segura que funciona diretamente no seu navegador.">
    <title>Assinar PDF com Imagem | PDF TRUE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.0/FileSaver.min.js"></script>

    <style>
        :root {
            --primary-color: #eb0e0e;
            --secondary-color: #e90606;
            --light-gray: #f8f9fa;
            --white: #ffffff;
            --danger-color: #dc3545;
            --success-color: #28a745;
        }
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            background-color: var(--light-gray);
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .tool-hero {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 40px 20px;
            text-align: center;
            border-radius: 0 0 10px 10px;
        }
        .tool-hero h1 { margin: 0; font-size: 2.5rem; }
        .tool-hero p { margin-top: 10px; font-size: 1.1rem; }
        .tool-container-wrapper {
            background-color: var(--white);
            margin-top: -20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 40px;
        }
        .tool-options {
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #eee;
            border-radius: 8px;
        }
        .tool-options h3 { margin-top: 0; color: var(--primary-color); }
        .form-group {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #f0f0f0;
        }
        .form-group:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 10px;
        }
        .form-group input[type="file"], .form-group input[type="text"] {
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .radio-group label {
            margin-right: 20px;
            font-weight: normal;
        }
        #specific-pages-input {
             margin-top: 10px;
        }

        .tool-actions { text-align: center; margin-top: 30px; }
        .btn { display: inline-block; padding: 12px 25px; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem; font-weight: 500; text-decoration: none; color: var(--white); transition: background-color 0.3s, transform 0.2s; }
        .btn-primary { background-color: var(--primary-color); }
        .btn-primary:hover { background-color: #b3000f; }
        .btn:disabled { background-color: var(--secondary-color); cursor: not-allowed; }
        #tool-btn { font-size: 1.2rem; padding: 15px 40px; }

        .user-message { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 15px 25px; border-radius: 5px; color: var(--white); z-index: 1000; font-size: 1rem; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .user-message.error { background-color: var(--danger-color); }
        .user-message.success { background-color: var(--success-color); }
    </style>
</head>
<body>
    <div class="tool-page">
        <section class="tool-hero">
            <div class="container">
                <div class="tool-hero-content">
                    <h1><i class="fas fa-signature"></i> Assinar PDF</h1>
                    <p>Assine uma ou mais páginas do seu documento PDF.</p>
                </div>
            </div>
        </section>
        <div class="container tool-container-wrapper">
            <div class="tool-main">
                 <div class="form-group">
                    <label for="pdf-input"><i class="fas fa-file-pdf"></i> 1. Selecione o arquivo PDF</label>
                    <input id="pdf-input" type="file" accept=".pdf">
                </div>

                <div class="form-group">
                    <label for="signature-input"><i class="fas fa-signature"></i> 2. Selecione a imagem da assinatura (PNG)</label>
                    <input id="signature-input" type="file" accept="image/png">
                </div>

                <div class="tool-options">
                    <h3><i class="fas fa-cog"></i> 3. Opções de Assinatura</h3>
                     <div class="form-group">
                        <label>Em quais páginas deseja inserir a assinatura?</label>
                        <div class="radio-group">
                            <input type="radio" id="all-pages" name="page-selection" value="all" checked>
                            <label for="all-pages">Todas as páginas</label>
                            
                            <input type="radio" id="first-page" name="page-selection" value="first">
                            <label for="first-page">Apenas a primeira</label>
                            
                            <input type="radio" id="last-page" name="page-selection" value="last">
                            <label for="last-page">Apenas a última</label>

                            <input type="radio" id="specific-pages" name="page-selection" value="specific">
                            <label for="specific-pages">Páginas específicas</label>
                        </div>
                        <input type="text" id="specific-pages-input" placeholder="Ex: 1, 3, 5-8" style="display: none;">
                    </div>
                </div>

                <div class="tool-actions">
                    <button id="tool-btn" class="btn btn-primary btn-lg">ASSINAR DOCUMENTO</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showUserMessage(message, type = 'success') {
            const messageDiv = document.createElement('div');
            messageDiv.textContent = message;
            messageDiv.className = `user-message ${type}`;
            document.body.appendChild(messageDiv);
            setTimeout(() => { messageDiv.remove(); }, 4000);
        }

        // Função para interpretar a seleção de páginas do usuário
        function parsePageSelection(selection, totalPages) {
            const pagesToSign = new Set();
            if (!selection) return [];

            const parts = selection.split(',');
            for (const part of parts) {
                const trimmedPart = part.trim();
                if (trimmedPart.includes('-')) {
                    const [start, end] = trimmedPart.split('-').map(num => parseInt(num, 10));
                    if (!isNaN(start) && !isNaN(end) && start <= end) {
                        for (let i = start; i <= end; i++) {
                            if (i > 0 && i <= totalPages) pagesToSign.add(i - 1); // Converte para índice 0
                        }
                    }
                } else {
                    const pageNum = parseInt(trimmedPart, 10);
                    if (!isNaN(pageNum) && pageNum > 0 && pageNum <= totalPages) {
                        pagesToSign.add(pageNum - 1); // Converte para índice 0
                    }
                }
            }
            return Array.from(pagesToSign);
        }

        async function handleSign(pdfFile, signatureFile, options) {
            const { PDFDocument } = PDFLib;

            const pdfBytes = await pdfFile.arrayBuffer();
            const signatureBytes = await signatureFile.arrayBuffer();

            const pdfDoc = await PDFDocument.load(pdfBytes);
            const signatureImage = await pdfDoc.embedPng(signatureBytes);
            
            const totalPages = pdfDoc.getPageCount();
            let pagesToModify = [];

            switch (options.selectionMode) {
                case 'all':
                    pagesToModify = Array.from({ length: totalPages }, (_, i) => i);
                    break;
                case 'first':
                    pagesToModify = [0];
                    break;
                case 'last':
                    pagesToModify = [totalPages - 1];
                    break;
                case 'specific':
                    pagesToModify = parsePageSelection(options.specificPages, totalPages);
                    if (pagesToModify.length === 0) {
                        throw new Error('Nenhuma página válida foi especificada. Verifique o formato (ex: 1, 3-5).');
                    }
                    break;
            }

            for (const pageIndex of pagesToModify) {
                if (pageIndex < 0 || pageIndex >= totalPages) continue;

                const page = pdfDoc.getPages()[pageIndex];
                const { width, height } = page.getSize();

                // Define as dimensões e a posição da assinatura (canto inferior direito)
                const sigWidth = 150;
                const sigHeight = (sigWidth / signatureImage.width) * signatureImage.height;
                const margin = 40;

                page.drawImage(signatureImage, {
                    x: width - sigWidth - margin,
                    y: margin,
                    width: sigWidth,
                    height: sigHeight,
                });
            }

            const modifiedPdfBytes = await pdfDoc.save();
            const blob = new Blob([modifiedPdfBytes], { type: 'application/pdf' });
            saveAs(blob, `assinado-${pdfFile.name}`);
            showUserMessage('PDF assinado com sucesso!', 'success');
        }

        document.addEventListener('DOMContentLoaded', function() {
            const toolBtn = document.getElementById('tool-btn');
            const pdfInput = document.getElementById('pdf-input');
            const signatureInput = document.getElementById('signature-input');
            const pageSelectionRadios = document.querySelectorAll('input[name="page-selection"]');
            const specificPagesInput = document.getElementById('specific-pages-input');

            // Mostra ou esconde o campo de texto para páginas específicas
            pageSelectionRadios.forEach(radio => {
                radio.addEventListener('change', () => {
                    specificPagesInput.style.display = radio.value === 'specific' ? 'block' : 'none';
                });
            });

            toolBtn.addEventListener('click', async () => {
                if (pdfInput.files.length === 0) return showUserMessage('Por favor, selecione o arquivo PDF.', 'error');
                if (signatureInput.files.length === 0) return showUserMessage('Por favor, selecione a imagem da assinatura.', 'error');
                
                const options = {
                    selectionMode: document.querySelector('input[name="page-selection"]:checked').value,
                    specificPages: specificPagesInput.value,
                };
                
                const originalText = toolBtn.textContent;
                toolBtn.textContent = 'Processando...';
                toolBtn.disabled = true;

                try {
                    await handleSign(pdfInput.files[0], signatureInput.files[0], options);
                } catch (e) {
                    showUserMessage('Ocorreu um erro: ' + e.message, 'error');
                    console.error(e);
                } finally {
                    toolBtn.textContent = originalText;
                    toolBtn.disabled = false;
                }
            });
        });
    </script>
    <script src="https://acscdn.com/script/aclib.js"></script>
    <script type="text/javascript">
        aclib.runAutoTag({
            zoneId: 'swr4mx0dij',
        });
    </script>
</body>
</html>

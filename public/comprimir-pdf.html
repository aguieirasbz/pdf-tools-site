<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Comprimir PDF | PDF TRUE</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.0/FileSaver.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script><script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script></head><body><header id="header-placeholder"></header><main class="tool-page"><section class="tool-hero"><div class="container"><div class="tool-hero-content"><h1><i class="fas fa-compress-arrows-alt"></i> Comprimir PDF</h1><p>Reduza o tamanho do arquivo escolhendo a qualidade desejada.</p></div></div></section><div class="container tool-container-wrapper"><div class="tool-main"><div class="upload-area"><i class="fas fa-cloud-upload-alt"></i><h3>Selecione o PDF</h3><label class="btn btn-primary btn-lg" for="pdf-file">Selecionar arquivo</label><input id="pdf-file" class="file-input" type="file" accept="application/pdf,.pdf"><p id="file-info"></p></div><div class="tool-options"><div class="option-group"><h3>Qualidade</h3><select id="quality"><option value="baixa">Menor arquivo</option><option value="media" selected>Equilibrada</option><option value="alta">Melhor qualidade</option></select><p style="margin-top:12px;color:var(--gray)">A compressão converte páginas em imagem. Textos podem deixar de ser selecionáveis.</p></div></div><div class="tool-actions"><button id="run" class="btn btn-primary btn-lg">COMPRIMIR PDF</button></div></div><aside class="tool-sidebar"><div class="info-section"><h3>Importante</h3><p>Em arquivos já otimizados, o resultado pode não ficar menor. Compare os dois arquivos.</p></div></aside></div></main><footer id="footer-placeholder"></footer><script src="js/main.js"></script><script src="js/advanced-pdf-tools.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const file=document.getElementById('pdf-file'),info=document.getElementById('file-info'),button=document.getElementById('run');AdvancedPdfTools.setupUpload(file,info);button.onclick=async()=>{if(!file.files[0])return alert('Selecione um PDF.');button.disabled=true;button.textContent='PROCESSANDO...';try{await AdvancedPdfTools.compressPdf(file.files[0],document.getElementById('quality').value);alert('PDF comprimido com sucesso.');}catch(e){alert(e.message);}finally{button.disabled=false;button.textContent='COMPRIMIR PDF';}};});</script></body></html>

<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Word para PDF | PDF TRUE</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script></head><body><header id="header-placeholder"></header><main class="tool-page"><section class="tool-hero"><div class="container"><div class="tool-hero-content"><h1><i class="fas fa-file-word"></i> Word para PDF</h1><p>Converta documentos DOCX em PDF diretamente no navegador.</p></div></div></section><div class="container tool-container-wrapper"><div class="tool-main"><div class="upload-area"><i class="fas fa-file-word"></i><h3>Selecione o documento Word</h3><label class="btn btn-primary btn-lg" for="word-file">Selecionar DOCX</label><input id="word-file" class="file-input" type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document"><p id="file-info"></p></div><div class="tool-actions"><button id="run" class="btn btn-primary btn-lg">CONVERTER PARA PDF</button></div></div><aside class="tool-sidebar"><div class="info-section"><h3>Compatibilidade</h3><p>Suporta DOCX. O texto é convertido; formatações avançadas, tabelas e imagens podem variar.</p></div></aside></div></main><footer id="footer-placeholder"></footer><script src="js/main.js"></script><script src="js/word-tools.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const file=document.getElementById('word-file'),info=document.getElementById('file-info'),button=document.getElementById('run');file.onchange=()=>info.textContent=file.files[0]?file.files[0].name:'';button.onclick=async()=>{if(!file.files[0])return alert('Selecione um arquivo DOCX.');button.disabled=true;try{await WordPdfTools.wordToPdf(file.files[0]);}catch(e){alert(e.message);}finally{button.disabled=false;}};});</script></body></html>

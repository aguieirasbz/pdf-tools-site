<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PDF para Word | PDF TRUE</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script><script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.0/FileSaver.min.js"></script></head><body><header id="header-placeholder"></header><main class="tool-page"><section class="tool-hero"><div class="container"><div class="tool-hero-content"><h1><i class="fas fa-file-word"></i> PDF para Word</h1><p>Extraia o texto de um PDF em um documento DOCX editável.</p></div></div></section><div class="container tool-container-wrapper"><div class="tool-main"><div class="upload-area"><i class="fas fa-file-pdf"></i><h3>Selecione o PDF</h3><label class="btn btn-primary btn-lg" for="pdf-file">Selecionar PDF</label><input id="pdf-file" class="file-input" type="file" accept="application/pdf,.pdf"><p id="file-info"></p></div><div class="tool-actions"><button id="run" class="btn btn-primary btn-lg">CONVERTER PARA WORD</button></div></div><aside class="tool-sidebar"><div class="info-section"><h3>Compatibilidade</h3><p>Gera DOCX com texto editável. PDFs escaneados precisam de OCR e layouts complexos podem variar.</p></div></aside></div></main><footer id="footer-placeholder"></footer><script src="js/main.js"></script><script src="js/word-tools.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const file=document.getElementById('pdf-file'),info=document.getElementById('file-info'),button=document.getElementById('run');file.onchange=()=>info.textContent=file.files[0]?file.files[0].name:'';button.onclick=async()=>{if(!file.files[0])return alert('Selecione um PDF.');button.disabled=true;try{await WordPdfTools.pdfToWord(file.files[0]);}catch(e){alert(e.message);}finally{button.disabled=false;}};});</script></body></html>

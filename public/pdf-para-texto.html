<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PDF para Texto | PDF TRUE</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script><script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script></head><body><header id="header-placeholder"></header><main class="tool-page"><section class="tool-hero"><div class="container"><div class="tool-hero-content"><h1><i class="fas fa-file-alt"></i> PDF para texto</h1><p>Extraia o texto selecionável do seu PDF.</p></div></div></section><div class="container tool-container-wrapper"><div class="tool-main"><div class="upload-area"><i class="fas fa-cloud-upload-alt"></i><h3>Selecione o PDF</h3><label class="btn btn-primary btn-lg" for="pdf-file">Selecionar arquivo</label><input id="pdf-file" class="file-input" type="file" accept="application/pdf,.pdf"><p id="file-info"></p></div><div class="tool-actions"><button id="run" class="btn btn-primary btn-lg">EXTRAIR TEXTO</button></div><div class="tool-options" id="result" hidden><div class="option-group"><h3>Texto extraído</h3><textarea id="text-output" rows="14" readonly style="width:100%;padding:12px"></textarea><p><button id="download" class="btn btn-outline" type="button">Baixar TXT</button></p></div></div></div><aside class="tool-sidebar"><div class="info-section"><h3>Observação</h3><p>PDFs escaneados como imagem precisam de OCR e podem não ter texto extraível.</p></div></aside></div></main><footer id="footer-placeholder"></footer><script src="js/main.js"></script><script src="js/advanced-pdf-tools.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const file=document.getElementById('pdf-file'),info=document.getElementById('file-info'),button=document.getElementById('run'),out=document.getElementById('text-output');AdvancedPdfTools.setupUpload(file,info);button.onclick=async()=>{if(!file.files[0])return alert('Selecione um PDF.');button.disabled=true;try{out.value=await AdvancedPdfTools.extractText(file.files[0]);document.getElementById('result').hidden=false;}catch(e){alert(e.message);}finally{button.disabled=false;}};document.getElementById('download').onclick=()=>saveAs(new Blob([out.value],{type:'text/plain;charset=utf-8'}),'texto-extraido.txt');});</script></body></html>

<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Adicionar Imagem ao PDF | PDF TRUE</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.0/FileSaver.min.js"></script></head><body><header id="header-placeholder"></header><main class="tool-page"><section class="tool-hero"><div class="container"><div class="tool-hero-content"><h1><i class="fas fa-image"></i> Adicionar imagem ao PDF</h1><p>Insira logo, carimbo ou imagem em páginas escolhidas.</p></div></div></section><div class="container tool-container-wrapper"><div class="tool-main"><div class="upload-area"><i class="fas fa-file-pdf"></i><h3>Selecione o PDF</h3><label class="btn btn-primary btn-lg" for="pdf-file">Selecionar PDF</label><input id="pdf-file" class="file-input" type="file" accept="application/pdf,.pdf"><p id="file-info"></p></div><div class="tool-options"><div class="option-group"><h3>Imagem</h3><input id="image-file" type="file" accept="image/png,image/jpeg"></div><div class="option-group"><h3>Páginas</h3><input id="pages" type="text" placeholder="Ex.: 1, 3-5 (vazio aplica em todas)"></div><div class="option-group"><h3>Posição e tamanho</h3><select id="position"><option value="bottom-right">Canto inferior direito</option><option value="bottom-left">Canto inferior esquerdo</option><option value="top-right">Canto superior direito</option><option value="top-left">Canto superior esquerdo</option><option value="center">Centro</option></select><input id="size" type="number" min="5" max="90" value="25" style="margin-top:12px"> % da largura da página</div></div><div class="tool-actions"><button id="run" class="btn btn-primary btn-lg">ADICIONAR IMAGEM</button></div></div><aside class="tool-sidebar"><div class="info-section"><h3>Formatos aceitos</h3><p>Use imagens JPG ou PNG. A imagem é aplicada somente no navegador.</p></div></aside></div></main><footer id="footer-placeholder"></footer><script src="js/main.js"></script><script src="js/advanced-pdf-tools.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const pdf=document.getElementById('pdf-file'),image=document.getElementById('image-file'),info=document.getElementById('file-info'),button=document.getElementById('run');AdvancedPdfTools.setupUpload(pdf,info);button.onclick=async()=>{if(!pdf.files[0]||!image.files[0])return alert('Selecione o PDF e a imagem.');button.disabled=true;try{await AdvancedPdfTools.addImage(pdf.files[0],image.files[0],document.getElementById('pages').value,document.getElementById('position').value,document.getElementById('size').value);alert('Imagem adicionada com sucesso.');}catch(e){alert(e.message);}finally{button.disabled=false;}};});</script></body></html>
